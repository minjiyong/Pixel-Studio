name: Pixel Studio checks
on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r tools/pixel_studio/requirements.txt
      - name: Run core and UI regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tools.pixel_studio.test_core tools.pixel_studio.test_ui -v
